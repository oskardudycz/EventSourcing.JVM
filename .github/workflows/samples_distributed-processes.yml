name: Samples - Distributed Processes in Event Sourcing

on:
  # run it on push to the default repository branch
  push:
    branches: [main]
    paths:
      - "samples/distributed-processes/**"
  # run it during pull request
  pull_request:
    paths:
      - "samples/distributed-processes/**"

defaults:
  run:
    working-directory: samples/distributed-processes

jobs:
  build-and-test-code:
    name: Build and test
    runs-on: ubuntu-latest

    strategy:
      # define the test matrix
      matrix:
        java-version: [22]

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install the system packages for Chromium
        run: ./gradlew playwrightInstallDeps

      - name: Build with Gradle
        run: ./gradlew build -Pci=true

      - name: Build and test the EventCatalog
        run: ./gradlew eventCatalogTest

      - name: Check that the API documents and the catalog match the code
        run: |
          git status --porcelain -- eventcatalog/specs eventcatalog/domains
          test -z "$(git status --porcelain -- eventcatalog/specs eventcatalog/domains)"

      - name: Archive test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test report
          path: ./samples/distributed-processes/build/test-results/test

      - name: Archive EventCatalog test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: EventCatalog test results
          path: ./samples/distributed-processes/eventcatalog/test-results
