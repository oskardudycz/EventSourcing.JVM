name: Samples - E-Commerce Distributed Process with Event Sourcing

on:
  # run it on push to the default repository branch
  push:
    branches: [main]
    paths:
      - "samples/e-commerce/**"
  # run it during pull request
  pull_request:
    paths:
      - "samples/e-commerce/**"

defaults:
  run:
    working-directory: samples/e-commerce

jobs:
  build-and-test-code:
    name: Build and test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # define the test matrix
      matrix:
        java-version: [22, 25, 27]

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Download dependencies
        run: |
          for attempt in 1 2 3; do
            ./gradlew testClasses --refresh-dependencies && exit 0
            echo "Attempt $attempt failed, retrying in 30 seconds"
            sleep 30
          done
          exit 1

      - name: Install the system packages for Chromium
        run: ./gradlew playwrightInstallDeps

      - name: Build with Gradle
        run: ./gradlew build

      - name: Build and test the EventCatalog
        run: ./gradlew eventCatalogTest

      - name: Check that the API documents and the catalog match the code
        run: |
          git status --porcelain -- eventcatalog/specs eventcatalog/domains
          test -z "$(git status --porcelain -- eventcatalog/specs eventcatalog/domains)"

      - name: Archive test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test report - Java ${{ matrix.java-version }}
          path: ./samples/e-commerce/build/test-results/test

      - name: Archive EventCatalog test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: EventCatalog test results - Java ${{ matrix.java-version }}
          path: ./samples/e-commerce/eventcatalog/test-results
