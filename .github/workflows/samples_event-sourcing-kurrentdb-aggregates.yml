name: Samples - Event Sourcing with Spring Boot and KurrentDB using Aggregate pattern

on:
  # run it on push to the default repository branch
  push:
    branches: [main]
    paths:
      - "samples/event-sourcing-kurrentdb-aggregates/**"
  # run it during pull request
  pull_request:
    paths:
      - "samples/event-sourcing-kurrentdb-aggregates/**"

defaults:
  run:
    working-directory: samples/event-sourcing-kurrentdb-aggregates

jobs:
  build-and-test-code:
    name: Build and test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # define the test matrix
      matrix:
        java-version: [22, 25, 27]

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"
          cache: gradle
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build with Gradle
        run: ./gradlew build -Pci=true

      - name: Archive test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test report - Java ${{ matrix.java-version }}
          path: ./samples/event-sourcing-kurrentdb-aggregates/build/test-results/test
