plugins {
  id 'java'
  id 'org.springframework.boot' version '4.1.2'
  id 'io.spring.dependency-management' version '1.1.7'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(22)
  }
}

bootJar {
  enabled = false
}

jar {
  enabled = true
}

group = 'io.event-driven'
version = '0.0.1-SNAPSHOT'

repositories {
  mavenCentral()
}

dependencies {
  // Spring Boot Web
  implementation 'org.springframework.boot:spring-boot-starter-web'
  // Validation
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  // For PostgreSQL Event Store
  implementation 'org.springframework.boot:spring-boot-starter-jdbc'

  // RabbitMQ
  implementation 'org.springframework.boot:spring-boot-starter-amqp'

  // Kafka
  implementation 'org.springframework.boot:spring-boot-starter-kafka'

  // Serialisation
  implementation 'tools.jackson.core:jackson-databind'
  implementation 'tools.jackson.core:jackson-core'

  // Postgres client
  implementation 'org.postgresql:postgresql'

  // Logging
  implementation 'org.springframework.boot:spring-boot-starter-log4j2'
  implementation 'org.apache.logging.log4j:log4j-api'
  implementation 'org.apache.logging.log4j:log4j-core'

  // Observability - Micrometer Tracing
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry'
  implementation 'io.micrometer:micrometer-tracing-bridge-otel'
  implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
  implementation 'io.micrometer:micrometer-registry-otlp'
  implementation 'org.springframework.boot:spring-boot-starter-aspectj'

  // Micrometer testing
  testImplementation 'org.springframework.boot:spring-boot-micrometer-tracing-test'
  testImplementation 'org.springframework.boot:spring-boot-micrometer-metrics-test'
  testImplementation 'io.micrometer:micrometer-tracing-test'
  testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'

  // Test frameworks
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-testcontainers'

  testImplementation 'org.assertj:assertj-core'
  testImplementation 'org.testcontainers:testcontainers-rabbitmq'
  testImplementation 'org.testcontainers:testcontainers-kafka'
  testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
  testImplementation 'net.datafaker:datafaker:2.3.0'
  testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
}

configurations {
  all {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    exclude group: 'ch.qos.logback'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
  }
}

def isCi = project.hasProperty('ci') && project.property('ci') == 'true'

test {
  useJUnitPlatform {
    if (isCi) {
      excludeTags 'Exercise'
    }
  }
  if (project.hasProperty('observability')) {
    systemProperty 'spring.profiles.active', 'observability'
  }
  testLogging.showStandardStreams = true
  testLogging.exceptionFormat = 'full'
}
