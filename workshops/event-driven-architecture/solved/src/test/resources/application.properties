spring.application.name=event-driven-architecture-workshop

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=latest

management.tracing.baggage.correlation.enabled=true
management.tracing.baggage.correlation.fields=correlationId,causationId,entityId,entityVersion
management.tracing.baggage.remote-fields=correlationId,causationId,entityId,entityVersion
management.tracing.baggage.tag-fields=correlationId,causationId,entityId,entityVersion
management.tracing.export.enabled=true
management.tracing.sampling.probability=1.0
management.observations.annotations.enabled=true

# OTLP Tracing - endpoint required for auto-configuration
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.tracing.export.otlp.enabled=false
management.opentelemetry.tracing.export.schedule-delay=100ms

# OTLP Metrics - pushed only with the observability profile
management.otlp.metrics.export.enabled=false
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
