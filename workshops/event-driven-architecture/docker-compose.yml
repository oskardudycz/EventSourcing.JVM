services:
  #######################################################
  #  PostgreSQL
  #######################################################
  postgres:
    image: postgres:17.2-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - postgres

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - postgres

  #######################################################
  #  Grafana LGTM: OpenTelemetry collector, Tempo, Prometheus, Loki, Grafana
  #  Start with: docker compose --profile observability up -d
  #######################################################
  otel-lgtm:
    image: grafana/otel-lgtm:0.39.0
    profiles: [ observability ]
    volumes:
      - ./observability/tempo-config.yaml:/otel-lgtm/tempo-config.yaml:ro
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

networks:
  postgres:
    driver: bridge
