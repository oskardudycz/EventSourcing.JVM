plugins {
  id 'java'
  id 'com.diffplug.spotless' version '8.11.0'
}

java {
  if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_22)) {
    toolchain {
      languageVersion = JavaLanguageVersion.of(22)
    }
  }
}

tasks.withType(JavaCompile).configureEach {
  options.release = 22
}

group = 'io.event-driven'
version = '0.0.1-SNAPSHOT'

repositories {
  mavenCentral()
  maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
}

dependencies {
  // Serialisation
  implementation 'tools.jackson.core:jackson-databind:3.3.0'
  implementation 'tools.jackson.core:jackson-core:3.3.0'

  // Postgres client
  implementation 'org.postgresql:postgresql:42.7.14'

  // Logging
  implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
  implementation 'org.apache.logging.log4j:log4j-core:2.26.1'
  implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'

  // Test frameworks
  testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
  testImplementation 'org.assertj:assertj-core:3.27.7'
  testImplementation 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
  testImplementation 'org.junit.platform:junit-platform-launcher:6.1.3'
  testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
}

def isCi = project.hasProperty('ci') && project.property('ci') == 'true'

tasks.named('test') {
  doFirst {
    useJUnitPlatform {
      if (isCi) {
        excludeTags 'Exercise'
      }
    }
  }
}

test {
  testLogging.showStandardStreams = true
  testLogging.exceptionFormat = 'full'
}

spotless {
  enforceCheck false
  java {
    palantirJavaFormat('2.103.0')
    removeUnusedImports()
    formatAnnotations()
  }
}
