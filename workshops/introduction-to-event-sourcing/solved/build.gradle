plugins {
  id 'java'
  id 'org.springframework.boot' version '4.1.2'
  id 'io.spring.dependency-management' version '1.1.7'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(22)
  }
}

bootJar {
  enabled = false
}

jar {
  enabled = true
}

group = 'io.event-driven'
version = '0.0.1-SNAPSHOT'

repositories {
  mavenCentral()
}

configurations {
  mockitoAgent
}

dependencies {
  // Spring Boot Web
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  // Validation
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  // Swagger
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
  // For PostgreSQL Event Store
  implementation 'org.springframework.boot:spring-boot-starter-jdbc'

  // Postgres client
  implementation 'org.postgresql:postgresql'

  // MongoDB client
  implementation 'org.mongodb:mongodb-driver-sync'

  // KurrentDB client
  implementation 'io.kurrent:kurrentdb-client:1.2.1'

  // Logging
  implementation 'org.springframework.boot:spring-boot-starter-log4j2'
  implementation 'org.apache.logging.log4j:log4j-api'
  implementation 'org.apache.logging.log4j:log4j-core'

  // Test frameworks
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

  testImplementation 'org.assertj:assertj-core'
  testImplementation 'org.testcontainers:testcontainers-mongodb'
  testImplementation 'org.testcontainers:testcontainers-postgresql'
  testImplementation 'net.datafaker:datafaker:2.7.0'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  mockitoAgent('org.mockito:mockito-core') {
    transitive = false
  }
}

configurations {
  all {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    exclude group: 'ch.qos.logback'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    exclude group: 'spring-boot-starter-test', module: 'junit'
  }
}

tasks.named('test') {
  useJUnitPlatform {
    excludeTags 'Exercise'
  }
}

tasks.named('bootTestRun') {
  if (project.hasProperty('mainClass')) {
    mainClass = project.property('mainClass')
  }
}

test {
  useJUnitPlatform()
  jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
  testLogging.showStandardStreams = true
  testLogging.exceptionFormat = 'full'
}
