pluginManagement {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
  }
}

buildscript {
  if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_22)) {
    repositories {
      gradlePluginPortal()
    }
    dependencies {
      classpath 'org.gradle.toolchains:foojay-resolver:1.0.0'
    }
  }
}

if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_22)) {
  apply plugin: 'org.gradle.toolchains.foojay-resolver-convention'
}

rootProject.name = 'introduction-to-event-sourcing-exercises'
