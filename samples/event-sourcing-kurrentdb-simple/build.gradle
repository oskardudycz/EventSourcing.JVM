plugins {
  id 'org.springframework.boot' version '4.1.2'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'java'
  id 'com.diffplug.spotless' version '8.11.0'
}

java {
  if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_22)) {
    toolchain {
      languageVersion = JavaLanguageVersion.of(22)
    }
  }
}

tasks.withType(JavaCompile).configureEach {
  options.release = 22
}

group = 'io.event-driven'
version = '0.0.1-SNAPSHOT'

repositories {
  mavenCentral()
  maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
}

configurations {
  mockitoAgent
}

dependencies {
  // Spring Boot Web
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  // Validation
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  // Swagger
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

  // Log4J logging
  implementation 'org.springframework.boot:spring-boot-starter-log4j2'

  // KurrentDB client
  implementation 'io.kurrent:kurrentdb-client:1.2.1'


  // Postgres and JPA for read models
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.postgresql:postgresql'

  // Test frameworks
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testImplementation 'org.testcontainers:testcontainers-postgresql'

  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  mockitoAgent('org.mockito:mockito-core') {
    transitive = false
  }
}

configurations {
  all {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    exclude group: 'ch.qos.logback'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    exclude group: 'spring-boot-starter-test', module: 'junit'
  }
}

tasks.named('test') {
  useJUnitPlatform()
  jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}

test {
  testLogging.showStandardStreams = true
  testLogging.exceptionFormat = 'full'
}

spotless {
  enforceCheck false
  java {
    palantirJavaFormat('2.103.0')
    removeUnusedImports()
    formatAnnotations()
  }
}
