plugins {
  id 'java'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(22)
  }
}

group = 'io.event-driven'
version = '0.0.1-SNAPSHOT'

repositories {
  mavenCentral()
}

dependencies {
  // Serialisation
  implementation 'tools.jackson.core:jackson-databind:3.3.0'

  // KurrentDB client
  implementation 'io.kurrent:kurrentdb-client:1.2.1'

  // Logging
  implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
  implementation 'org.apache.logging.log4j:log4j-core:2.26.1'
  implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'

  // Test frameworks
  testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
  testImplementation 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
  testImplementation 'org.junit.platform:junit-platform-launcher:6.1.3'
  testImplementation 'org.testcontainers:testcontainers:2.0.5'

  // Approval / snapshot testing
  testImplementation 'com.approvaltests:approvaltests:31.0.0'
  testImplementation 'io.github.classgraph:classgraph:5.0.2'

  // Contract testing
  testImplementation 'io.event-driven:strictland:0.4.1'
  testImplementation 'org.jspecify:jspecify:1.0.1'
}

tasks.named('test') {
  useJUnitPlatform()
}

test {
  testLogging.showStandardStreams = true
  testLogging.exceptionFormat = 'full'
}
