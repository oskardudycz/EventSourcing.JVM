<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · Demo Shop'">Demo Shop</title>
  <link rel="stylesheet" th:href="@{/css/shop.css}">
  <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
</head>
<body>
<header th:fragment="header(customerId, current)" class="topbar">
  <a class="brand" th:href="@{/shop/customers/{c}/products(c=${customerId})}">Demo Shop</a>
  <nav>
    <a th:href="@{/shop/customers/{c}/products(c=${customerId})}" th:classappend="${current == 'products'} ? 'active'">Products</a>
    <a th:href="@{/shop/customers/{c}/cart(c=${customerId})}" th:classappend="${current == 'cart'} ? 'active'">Cart</a>
    <a th:href="@{/shop/customers/{c}/orders(c=${customerId})}" th:classappend="${current == 'orders'} ? 'active'">Orders</a>
    <details class="menu">
      <summary>Developer tools</summary>
      <div class="menu-items">
        <a th:href="${grafanaUrl}" target="_blank" rel="noopener">Grafana: traces, metrics, logs</a>
        <a href="/swagger-ui/index.html" target="_blank" rel="noopener">Swagger UI: the web API</a>
        <a href="/springwolf/asyncapi-ui.html" target="_blank" rel="noopener">Springwolf: the messages</a>
        <a th:href="${eventCatalogUrl}" target="_blank" rel="noopener">EventCatalog: modules and messages</a>
        <a href="/sandbox/warehouse" target="_blank" rel="noopener">Sandbox warehouse: stock and packages</a>
      </div>
    </details>
    <span class="customer" th:if="${customerName}" th:text="${customerName}">Name</span>
    <form class="logout" th:if="${customerName}" method="post" th:action="@{/shop/logout}">
      <button class="link" type="submit">Log out</button>
    </form>
    <a th:unless="${customerName}" th:href="@{/shop/login}">Log in</a>
  </nav>
</header>
</body>
</html>
