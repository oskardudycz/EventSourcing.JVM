<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{shop/fragments :: head('Orders')}"></head>
<body>
<header th:replace="~{shop/fragments :: header(${customerId}, 'orders')}"></header>
<main class="page narrow">
  <h1>Orders</h1>
  <section class="card empty" th:if="${#lists.isEmpty(orders)}">
    <p>You have no orders yet.</p>
  </section>
  <section class="card" th:unless="${#lists.isEmpty(orders)}">
    <table class="lines">
      <thead>
      <tr><th>Order</th><th>Placed</th><th>Status</th><th class="number">Total</th></tr>
      </thead>
      <tbody>
      <tr th:each="order : ${orders}">
        <td><a th:href="@{/shop/customers/{c}/orders/{o}(c=${customerId}, o=${order.orderId.tail()})}" th:title="${order.orderId.tail()}" th:text="${'Order #' + order.orderId.number()}">Order</a></td>
        <td class="nowrap" th:text="${#temporals.format(order.placedAt, 'yyyy-MM-dd HH:mm')}">Placed</td>
        <td><span class="badge" th:classappend="${order.progress.name()}" th:text="${order.progress.label()}">Status</span></td>
        <td class="number" th:text="${'$' + #numbers.formatDecimal(order.totalPrice, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
      </tr>
      </tbody>
    </table>
  </section>
</main>
</body>
</html>
