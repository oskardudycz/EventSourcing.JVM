messaging.bus=kafka
eventstore.type=kurrentdb
projections.database=postgresql
spring.docker.compose.profiles.active=sample,${messaging.bus}
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.sql.init.platform=postgres
spring.jpa.open-in-view=false
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
eventstore.postgresql.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/postgres
eventstore.postgresql.username=postgres
eventstore.postgresql.password=postgres
spring.kafka.bootstrap-servers=localhost:${KAFKA_PORT:9092}
messaging.kafka.publish-timeout=10s
spring.rabbitmq.host=localhost
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
messaging.rabbitmq.publish-timeout=10s
messaging.retry.initial-interval=1s
kurrentdb.connectionstring=kurrentdb://localhost:${KURRENTDB_PORT:2113}?tls=false
springwolf.docket.base-package=io.eventdriven.distributedprocesses.ecommerce
springwolf.docket.info.title=E-commerce
springwolf.docket.info.version=1.0.0
springwolf.docket.servers.kafka.protocol=kafka
springwolf.docket.servers.kafka.host=localhost:${KAFKA_PORT:9092}
springwolf.docket.servers.kafka.description=Apache Kafka, with messaging.bus=kafka. Each channel is a topic. A queue is a consumer group.
springwolf.docket.servers.rabbitmq.protocol=amqp
springwolf.docket.servers.rabbitmq.host=localhost:${RABBITMQ_PORT:5672}
springwolf.docket.servers.rabbitmq.description=RabbitMQ, with messaging.bus=rabbitmq. Each channel is a topic exchange. A queue is a quorum queue bound to it with a routing key pattern.
springwolf.docket.servers.in-memory.protocol=in-memory
springwolf.docket.servers.in-memory.host=localhost
springwolf.docket.servers.in-memory.description=The message bus inside the application. Each channel delivers a message to the queues bound to it with a matching routing key, as a RabbitMQ topic exchange does.
springwolf.docket.group-configs[0].group=shopping_carts
springwolf.docket.group-configs[0].channel-name-to-match=.*
springwolf.docket.group-configs[0].info.description=The customer's shopping cart. When the customer checks out, it publishes ShoppingCartCheckedOut for other modules.
springwolf.docket.group-configs[1].group=orders
springwolf.docket.group-configs[1].channel-name-to-match=.*
springwolf.docket.group-configs[1].info.description=The customer's order and the process around it. OrderSaga reacts to the checkout, the payment and the shipment, and sends the next command. The order decides when it is confirmed, completed or canceled.
springwolf.docket.group-configs[2].group=payments
springwolf.docket.group-configs[2].channel-name-to-match=.*
springwolf.docket.group-configs[2].info.description=Payments through a payment provider. The customer authorizes a payment on the provider's page. The shop charges the customer later, or cancels the payment. It answers on payments-responses.
springwolf.docket.group-configs[3].group=shipments
springwolf.docket.group-configs[3].channel-name-to-match=.*
springwolf.docket.group-configs[3].info.description=The warehouse. It sets aside products, sends packages through a fulfillment service, puts products back on sale, and answers on shipments-responses.
springdoc.group-configs[0].group=shopping_carts
springdoc.group-configs[0].paths-to-match=/customers/*/shopping-carts/**
springdoc.group-configs[1].group=orders
springdoc.group-configs[1].paths-to-match=/customers/*/orders/**
management.tracing.baggage.correlation.enabled=true
management.tracing.baggage.correlation.fields=correlationId,causationId
management.tracing.baggage.remote-fields=correlationId,causationId
management.tracing.baggage.tag-fields=correlationId,causationId
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:${OTEL_HTTP_PORT:4318}/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:${OTEL_HTTP_PORT:4318}/v1/logs
management.otlp.metrics.export.url=http://localhost:${OTEL_HTTP_PORT:4318}/v1/metrics
management.otlp.metrics.export.step=5s
logging.level.io.opentelemetry.exporter=off
logging.level.io.micrometer.registry.otlp=off
