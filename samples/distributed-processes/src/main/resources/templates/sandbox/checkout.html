<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · Sandbox</title>
  <link rel="stylesheet" th:href="@{/css/checkout.css}">
</head>
<body>
<div class="checkout">
  <section class="summary">
    <a class="back" th:href="${checkout.cancelUrl()}">&larr; Back to Demo Shop</a>
    <p class="merchant">Demo Shop <span class="sandbox">Sandbox</span></p>
    <p class="label">Pay Demo Shop</p>
    <p class="amount" th:text="${'$' + #numbers.formatDecimal(checkout.amount(), 1, 'COMMA', 2, 'POINT')}">$0.00</p>
  </section>
  <section class="payment">
    <div th:if="${expired}" class="expired">
      <h1>This checkout session has expired</h1>
      <p>Go back to the shop and choose "Pay now" again.</p>
      <a class="button" th:href="${checkout.cancelUrl()}">Back to Demo Shop</a>
    </div>
    <form th:unless="${expired}" method="post" th:action="@{/sandbox/checkout/{id}(id=${checkout.id()})}">
      <h1>Pay with card</h1>
      <label for="cardNumber">Card information</label>
      <div class="card-fields">
        <input id="cardNumber" name="cardNumber" inputmode="numeric" autocomplete="cc-number"
               placeholder="1234 1234 1234 1234" required>
        <div class="row">
          <input aria-label="Expiration" placeholder="MM / YY" autocomplete="cc-exp">
          <input aria-label="CVC" placeholder="CVC" autocomplete="cc-csc">
        </div>
      </div>
      <label for="name">Cardholder name</label>
      <input id="name" placeholder="Full name on card" autocomplete="cc-name">
      <p class="error" th:if="${error}" th:text="${error}">Error</p>
      <button class="pay" type="submit" th:text="${'Pay $' + #numbers.formatDecimal(checkout.amount(), 1, 'COMMA', 2, 'POINT')}">Pay</button>
      <p class="hint">Sandbox: 4242 4242 4242 4242 pays, 4000 0000 0000 0002 is declined.</p>
    </form>
  </section>
</div>
</body>
</html>
