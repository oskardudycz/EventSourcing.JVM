import com.github.gradle.node.npm.task.NpmTask
import com.github.gradle.node.npm.task.NpxTask

plugins {
  id 'java'
  id 'org.springframework.boot' version '4.1.2'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.springdoc.openapi-gradle-plugin' version '2.1.0'
  id 'com.github.node-gradle.node' version '7.1.0'
  id 'com.diffplug.spotless' version '8.11.0'
}

java {
  if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_22)) {
    toolchain {
      languageVersion = JavaLanguageVersion.of(22)
    }
  }
}

tasks.withType(JavaCompile).configureEach {
  options.release = 22
}

group = 'io.event-driven'
version = '0.0.1-SNAPSHOT'


repositories {
  mavenCentral()
  maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
}

configurations {
  mockitoAgent
}

dependencies {
  // Serialisation
  implementation 'tools.jackson.core:jackson-databind'

  // Kafka
  implementation 'org.springframework.boot:spring-boot-starter-kafka'

  // RabbitMQ
  implementation 'org.springframework.boot:spring-boot-starter-amqp'

  // KurrentDB client
  implementation 'io.kurrent:kurrentdb-client:1.2.1'

  // Logging
  implementation 'org.springframework.boot:spring-boot-starter-log4j2'

  // Web API, shop pages and Swagger UI
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

  // AsyncAPI documentation of the channels
  implementation 'io.github.springwolf:springwolf-core:2.9.0'
  runtimeOnly 'io.github.springwolf:springwolf-ui:2.9.0'

  // Tracing: Micrometer Tracing with the OpenTelemetry bridge
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry'
  implementation 'io.micrometer:micrometer-tracing-bridge-otel'

  // Traces, metrics and logs to Grafana LGTM over OTLP
  implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
  implementation 'io.micrometer:micrometer-registry-otlp'
  implementation 'io.opentelemetry.instrumentation:opentelemetry-log4j-appender-2.17:2.28.0-alpha'

  // Postgres and JPA for read models
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.postgresql:postgresql'
  runtimeOnly 'com.h2database:h2'

  // Starts the Docker Compose services with bootRun
  developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
  testImplementation 'org.springframework.boot:spring-boot-docker-compose'

  // Test frameworks
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testImplementation 'org.springframework.boot:spring-boot-micrometer-tracing-test'
  testImplementation 'org.springframework.boot:spring-boot-micrometer-metrics-test'
  testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
  testImplementation 'org.testcontainers:testcontainers'
  testImplementation 'org.testcontainers:testcontainers-postgresql'
  testImplementation 'org.testcontainers:testcontainers-kafka'
  testImplementation 'org.testcontainers:testcontainers-rabbitmq'
  testImplementation 'org.testcontainers:testcontainers-grafana'
  testImplementation 'com.microsoft.playwright:playwright:1.65.1'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  mockitoAgent('org.mockito:mockito-core') { transitive = false }
}

configurations {
  all {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    exclude group: 'ch.qos.logback'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
  }
}

tasks.named('test') {
  useJUnitPlatform()
  jvmArgs += ["-javaagent:${configurations.mockitoAgent.asPath}", "-Xshare:off"]
}

test {
  testLogging.showStandardStreams = true
  testLogging.exceptionFormat = 'full'
}

tasks.register('playwrightInstallDeps', JavaExec) {
  group = 'verification'
  description = 'Installs the system packages that Chromium needs for the browser tests (uses sudo).'
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.microsoft.playwright.CLI'
  args = ['install-deps', 'chromium']
}

tasks.register('howToScreenshots', Test) {
  group = 'documentation'
  description = 'Goes through the shop in Chromium and saves the screenshots of HOWTO.md to assets/howto.'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform()
  filter { includeTestsMatching '*ShopInBrowserTests' }
  systemProperty 'screenshots.dir', file('assets/howto').absolutePath
  outputs.upToDateWhen { false }
}

def contractsPort = 18086
openApi {
  outputDir.set(file('eventcatalog/specs'))
  groupedApiMappings.set([
    ("http://localhost:${contractsPort}/v3/api-docs/shopping_carts".toString())  : 'openapi-shopping_carts.json',
    ("http://localhost:${contractsPort}/v3/api-docs/orders".toString())          : 'openapi-orders.json',
    ("http://localhost:${contractsPort}/springwolf/docs/shopping_carts".toString()): 'asyncapi-shopping_carts.json',
    ("http://localhost:${contractsPort}/springwolf/docs/orders".toString())       : 'asyncapi-orders.json',
    ("http://localhost:${contractsPort}/springwolf/docs/payments".toString())     : 'asyncapi-payments.json',
    ("http://localhost:${contractsPort}/springwolf/docs/shipments".toString())    : 'asyncapi-shipments.json'
  ])
  customBootRun {
    args.set(["--server.port=${contractsPort}".toString(), "--spring.profiles.active=in-memory"])
  }
}

node {
  download = true
  version = '26.13.1'
  nodeProjectDir = file('eventcatalog')
}

tasks.register('eventCatalogGenerate', NpmTask) {
  group = 'documentation'
  description = 'Writes the EventCatalog pages from the OpenAPI and AsyncAPI documents.'
  dependsOn 'npmInstall', 'generateOpenApiDocs'
  args = ['run', 'generate']
}

tasks.register('eventCatalog', NpmTask) {
  group = 'documentation'
  description = 'Builds the EventCatalog site into eventcatalog/dist.'
  dependsOn 'eventCatalogGenerate'
  args = ['run', 'build']
}

tasks.register('eventCatalogPreview', NpmTask) {
  group = 'documentation'
  description = 'Serves the built EventCatalog on http://localhost:3001.'
  dependsOn 'eventCatalog'
  args = ['run', 'preview']
}

tasks.register('eventCatalogBrowsers', NpxTask) {
  group = 'verification'
  description = 'Installs the Chromium that the EventCatalog tests use.'
  dependsOn 'npmInstall'
  command = 'playwright'
  args = ['install', 'chromium']
}

tasks.register('eventCatalogScreenshots', NpmTask) {
  group = 'documentation'
  description = 'Checks the built EventCatalog and saves the screenshots of HOWTO.md to assets/howto.'
  dependsOn 'eventCatalog', 'eventCatalogBrowsers'
  args = ['test']
  environment = ['SCREENSHOTS_DIR': file('assets/howto').absolutePath]
}

tasks.register('eventCatalogTest', NpmTask) {
  group = 'verification'
  description = 'Checks the built EventCatalog in Chromium.'
  dependsOn 'eventCatalog', 'eventCatalogBrowsers'
  args = ['test']
}

spotless {
  enforceCheck false
  java {
    palantirJavaFormat('2.103.0')
    removeUnusedImports()
    formatAnnotations()
  }
}
